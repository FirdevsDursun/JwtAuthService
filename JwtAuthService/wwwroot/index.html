<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Console | Enterprise JWT Microservice</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --primary-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

            .brand-header h1 {
                font-size: 1.8rem;
                font-weight: 700;
                background: linear-gradient(to right, #ffffff, #a5b4fc);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                letter-spacing: -0.02em;
            }

            .brand-header p {
                color: var(--text-muted);
                font-size: 0.9rem;
                margin-top: 0.3rem;
            }

        .badge-micro {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .dashboard-grid {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 1.5rem;
        }

        @media (max-width: 820px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.88rem;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

            .tab-btn.active {
                background: var(--primary-gradient);
                color: #ffffff;
                box-shadow: 0 4px 12px var(--primary-glow);
            }

        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: block;
                animation: fadeIn 0.3s ease;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease;
        }

            input:focus {
                border-color: #818cf8;
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
                background: rgba(15, 23, 42, 0.8);
            }

        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--primary-glow);
            margin-top: 0.5rem;
        }

            .btn-primary:hover {
                opacity: 0.95;
                transform: translateY(-1px);
            }

        .btn-outline {
            width: 100%;
            padding: 0.75rem;
            background: transparent;
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

            .btn-outline:hover {
                background: rgba(99, 102, 241, 0.12);
                border-color: #818cf8;
                color: #ffffff;
            }

        /* Console Output Section */
        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .session-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

            .session-status.online {
                background: rgba(16, 185, 129, 0.15);
                color: var(--accent-green);
                border-color: rgba(16, 185, 129, 0.2);
            }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .token-group {
            margin-bottom: 1rem;
        }

        .token-box {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #c7d2fe;
            word-break: break-all;
            max-height: 75px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .toast {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            line-height: 1.4;
        }

            .toast.success {
                display: block;
                background: rgba(16, 185, 129, 0.12);
                border: 1px solid rgba(16, 185, 129, 0.3);
                color: #34d399;
            }

            .toast.error {
                display: block;
                background: rgba(239, 68, 68, 0.12);
                border: 1px solid rgba(239, 68, 68, 0.3);
                color: #f87171;
            }
    </style>
</head>
<body>

    <div class="brand-header">
        <span class="badge-micro">.NET 8 Web API</span>
        <h1>JWT Auth Microservice Console</h1>
        <p>Token tabanlı kimlik doğrulama ve güvenli oturum yönetimi</p>
    </div>

    <div class="dashboard-grid">
        <!-- Sol Panel: Tabbed Form -->
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Giriş Yap</button>
                <button class="tab-btn" onclick="switchTab('register')">Kayıt Ol</button>
            </div>

            <!-- Giriş Formu -->
            <div id="loginTab" class="tab-content active">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="loginUser" placeholder="kullanici_adi" required>
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="loginPass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Sisteme Giriş Yap</button>
                </form>
            </div>

            <!-- Kayıt Formu -->
            <div id="registerTab" class="tab-content">
                <form id="regForm">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="regUser" placeholder="yeni_kullanici" required>
                    </div>
                    <div class="form-group">
                        <label>E-Posta Adresi</label>
                        <input type="email" id="regEmail" placeholder="ornek@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="regPass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Hesap Oluştur</button>
                </form>
            </div>

            <div id="authToast" class="toast"></div>
        </div>

        <!-- Sağ Panel: Token & Terminal Monitoring -->
        <div class="card">
            <div class="card-header-flex">
                <span class="card-title">Session Monitor</span>
                <div id="sessionStatus" class="session-status">
                    <span class="status-dot"></span>
                    <span id="sessionStatusText">Oturum Yok</span>
                </div>
            </div>

            <div class="token-group">
                <label>Access Token (Bearer / JWT)</label>
                <div id="accTokenBox" class="token-box">Token bekleniyor...</div>
            </div>

            <div class="token-group">
                <label>Refresh Token</label>
                <div id="refTokenBox" class="token-box">Token bekleniyor...</div>
            </div>

            <button id="btnProtected" class="btn-outline">
                🔒 /api/Auth/protected Test Et
            </button>
            <button id="btnRefresh" class="btn-outline">
                🔄 Token Yenile (Refresh)
            </button>

            <div id="apiToast" class="toast"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api/Auth';
        let accessToken = '';
        let refreshToken = '';

        // Tab Değiştirme
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }

        // Toast Mesaj Gösterimi
        function showToast(elementId, text, isSuccess) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.className = 'toast ' + (isSuccess ? 'success' : 'error');
        }

        // Oturum Durumu Güncelleme
        function updateSessionStatus(isOnline) {
            const statusEl = document.getElementById('sessionStatus');
            const textEl = document.getElementById('sessionStatusText');
            if (isOnline) {
                statusEl.className = 'session-status online';
                textEl.innerText = 'Aktif Oturum';
            } else {
                statusEl.className = 'session-status';
                textEl.innerText = 'Oturum Yok';
            }
        }

        // 1. Kayıt
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUser').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPass').value
                    })
                });
                const data = await res.text();
                showToast('authToast', data, res.ok);
                if (res.ok) switchTab('login');
            } catch (err) {
                showToast('authToast', 'Bağlantı hatası oluştu.', false);
            }
        });

        // 2. Giriş
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUser').value,
                        password: document.getElementById('loginPass').value
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    accessToken = data.accessToken;
                    refreshToken = data.refreshToken;

                    document.getElementById('accTokenBox').innerText = accessToken;
                    document.getElementById('refTokenBox').innerText = refreshToken;

                    updateSessionStatus(true);
                    showToast('authToast', 'Başarıyla giriş yapıldı!', true);
                } else {
                    const text = await res.text();
                    showToast('authToast', text || 'Hatalı kullanıcı adı veya şifre.', false);
                }
            } catch (err) {
                showToast('authToast', 'Bağlantı hatası oluştu.', false);
            }
        });

        // 3. Protected Endpoint
        document.getElementById('btnProtected').addEventListener('click', async () => {
            if (!accessToken) {
                showToast('apiToast', 'Lütfen önce giriş yapın.', false);
                return;
            }

            try {
                const res = await fetch(`${API_URL}/protected`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.text();
                showToast('apiToast', data, res.ok);
            } catch (err) {
                showToast('apiToast', 'İstek başarısız.', false);
            }
        });

        // 4. Refresh Token
        document.getElementById('btnRefresh').addEventListener('click', async () => {
            if (!refreshToken) {
                showToast('apiToast', 'Refresh token bulunamadı.', false);
                return;
            }

            try {
                const res = await fetch(`${API_URL}/refresh-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken: refreshToken })
                });

                if (res.ok) {
                    const data = await res.json();
                    accessToken = data.accessToken;
                    refreshToken = data.refreshToken;

                    document.getElementById('accTokenBox').innerText = accessToken;
                    document.getElementById('refTokenBox').innerText = refreshToken;
                    showToast('apiToast', 'Token başarıyla yenilendi!', true);
                } else {
                    updateSessionStatus(false);
                    showToast('apiToast', 'Geçersiz Refresh Token.', false);
                }
            } catch (err) {
                showToast('apiToast', 'Bağlantı hatası oluştu.', false);
            }
        });
    </script>
</body>
</html>
